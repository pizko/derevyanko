<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" class="sk-plan" role="img" aria-labelledby="sk-plan-title sk-plan-desc">
<title id="sk-plan-title">План кухни-гостиной с видом сверху</title>
<desc id="sk-plan-desc">Последовательно появляются стены, кухня, обеденный стол, диван, журнальный столик и растение. Цикл 12 секунд.</desc>
<style>.sk-plan{color:#8B8B87;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.sk-plan text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:8px;letter-spacing:1.5px;stroke:none;fill:#8B8B87}
.sk-plan .fine{stroke-width:.7;opacity:.46} .sk-plan .accent{stroke:#A70F27}
.sk-plan .white{stroke:#F3F2EE} .sk-plan .solid{fill:#141516}
.sk-plan .grid{stroke-width:.55;stroke:#343536;opacity:.27}
.sk-plan .anim{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.22,.75,.2,1);transform-box:fill-box;transform-origin:center}
.sk-plan .shell{animation-name:sk-plan-shell}
@keyframes sk-plan-shell{0%,2.92%{opacity:0;transform:translateY(6px) scale(.97)}9.58%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .kitchen{animation-name:sk-plan-kitchen}
@keyframes sk-plan-kitchen{0%,11.25%{opacity:0;transform:translateY(6px) scale(.97)}17.92%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .rug{animation-name:sk-plan-rug}
@keyframes sk-plan-rug{0%,18.75%{opacity:0;transform:translateY(6px) scale(.97)}25.42%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .dining{animation-name:sk-plan-dining}
@keyframes sk-plan-dining{0%,22.92%{opacity:0;transform:translateY(6px) scale(.97)}29.58%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .sofa{animation-name:sk-plan-sofa}
@keyframes sk-plan-sofa{0%,28.75%{opacity:0;transform:translateY(6px) scale(.97)}35.42%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .table{animation-name:sk-plan-table}
@keyframes sk-plan-table{0%,34.58%{opacity:0;transform:translateY(6px) scale(.97)}41.25%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .details{animation-name:sk-plan-details}
@keyframes sk-plan-details{0%,40.83%{opacity:0;transform:translateY(6px) scale(.97)}47.50%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .measure{animation-name:sk-plan-measure}
@keyframes sk-plan-measure{0%,44.58%{opacity:0;transform:translateY(6px) scale(.97)}51.25%,86%{opacity:1;transform:translateY(0) scale(1)}95%,100%{opacity:0;transform:translateY(0) scale(1)}}
.sk-plan .trace{stroke-dasharray:1;animation:sk-plan-trace 12s cubic-bezier(.22,.75,.2,1) infinite}
@keyframes sk-plan-trace{0%,3%{stroke-dashoffset:1;opacity:0}5%{opacity:1}20%,86%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
.sk-plan .signal{animation:sk-plan-signal 12s ease infinite}
@keyframes sk-plan-signal{0%,42%,97%,100%{opacity:0}51%,84%{opacity:1}92%{opacity:0}}
@media(prefers-reduced-motion:reduce){.sk-plan .anim,.sk-plan .trace,.sk-plan .signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style>
